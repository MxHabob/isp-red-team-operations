name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate repository structure
        run: python scripts/validate_repo.py

      - name: Scan for secrets
        run: python scripts/scan_secrets.py

      - name: Validate data isolation
        run: python scripts/validate_data_isolation.py

      - name: Run test suite
        run: pytest -v
